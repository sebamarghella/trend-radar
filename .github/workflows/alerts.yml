name: Trend Radar Alerts

on:
  schedule:
    # 16:30 New York time Monday-Friday, after the daily candle has closed.
    - cron: '30 16 * * 1-5'
      timezone: 'America/New_York'
  workflow_dispatch:
    inputs:
      send_todays_fills:
        description: "Send today's confirmed Stocks flips now (weekdays after 16:15 New York)"
        type: boolean
        default: false

permissions:
  contents: write  # so the job can commit alerts_state.json back

concurrency:
  group: trend-radar-alerts
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-alerts.txt

      - name: Install dependencies
        run: pip install -r requirements-alerts.txt

      - name: Run alert engine
        id: alert_engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TR_SEND_TODAYS_FILLS: ${{ inputs.send_todays_fills }}
        run: python run_alerts.py

      - name: Commit updated state & history
        if: ${{ success() || steps.alert_engine.outcome == 'failure' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          changed=0
          [[ -f .cache/alerts_state.json ]]  && git add .cache/alerts_state.json  && changed=1
          [[ -f .cache/alerts_history.json ]] && git add .cache/alerts_history.json && changed=1
          [[ -f .cache/stocks_alert_positions.json ]] && git add .cache/stocks_alert_positions.json && changed=1
          # Forward track record (equity curve + trade log) — see live_log.py
          for f in .cache/live_*_equity.json .cache/live_*_trades.json; do
            [[ -f "$f" ]] && git add "$f" && changed=1
          done
          if [[ $changed -eq 1 ]] && ! git diff --staged --quiet; then
            git commit -m "chore: update alert state + history [skip ci]"
            git push
          else
            echo "No state changes."
          fi
